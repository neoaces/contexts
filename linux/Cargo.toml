[package]
name = "contexts-linux"
version = "0.2.0"
edition = "2021"

[lib]
name = "contexts"
path = "src/lib.rs"

[[bin]]
name = "contexts-linux"
path = "src/main.rs"

# Pinned to the gtk-rs 0.9 generation (GTK 4.14, libadwaita 1.5 on Ubuntu 24.04):
# ratex-gtk4 needs it, and Cargo can't link two gtk4-sys versions.
# Don't enable v4_16 or v1_6; noble doesn't have them.
[dependencies]
gtk = { package = "gtk4", version = "0.9.7", features = ["gnome_46"] }
adw = { package = "libadwaita", version = "0.7.2", features = ["v1_5"] }
gdk4-x11 = "0.9"
ratex-gtk4 = "=0.1.15"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
